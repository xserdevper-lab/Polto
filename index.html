<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>MySpace</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="loading.css">
</head>

<body>

    <main class="loading-screen">

        <!-- Logo -->
        <div class="logo-area">

            <div class="logo-mark">
                <span class="logo-dot"></span>
                <span class="logo-dot"></span>
                <span class="logo-dot"></span>
            </div>

            <h1>MySpace</h1>

            <p>YOUR SPACE. YOUR LIFE.</p>

        </div>


        <!-- Bottom Area -->
        <div class="bottom-area">

            <div class="slide-label">
                <span>SLIDE TO ENTER</span>
            </div>

            <div class="slider" id="slider">

                <div class="slider-track"></div>

                <div class="slider-text">
                    เลื่อนเพื่อเข้าสู่ MySpace
                </div>

                <button
                    class="slider-button"
                    id="sliderButton"
                    aria-label="เข้าสู่ MySpace"
                >
                    <span>→</span>
                </button>

            </div>

            <div class="version">
                MYSPACE · 01
            </div>

        </div>

    </main>

    <script src="loading.js"></script>

</body>
</html>
